  <h2>今日诗词</h2>
  <p>今天是：
    <script>
      var today = new Date();
      var date = today.getFullYear() + "年" + (today.getMonth() + 1) + "月" + today.getDate() + "日";
      document.write(date);
    </script>
  </p>

  <div>
    <p>
    <span id="gushici"></span>
    ——《
    <span id="origin"></span>
    》
    <span id="author"></span>
    </p>

    <script>
      var xhr = new XMLHttpRequest();
      xhr.open('get', 'https://v1.jinrishici.com/all.json');
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          var data = JSON.parse(xhr.responseText);
          var gushici = document.getElementById('gushici');
          var author = document.getElementById('author');
          var origin = document.getElementById('origin');
          gushici.innerText = data.content;
          author.innerText = data.author;
          origin.innerText = data.origin;
        }
      };
      xhr.send();
    </script>
  </div>

  <hr />

  <div id="content"></div>
